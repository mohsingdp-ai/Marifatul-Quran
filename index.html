<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var t = localStorage.getItem("ui_theme");
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marifatul Quran - Ruku Recordings</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d4f4f">

  <!-- iOS home-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MQ Ruku">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Marifatul Quran</h1>
    <p class="subtitle">Ruku Recordings</p>
  </header>

  <main class="main">
    <div class="controls toolbar">
      <div class="controls-left">
        <label for="para-select">Para (Juz)</label>
        <select id="para-select" aria-label="Select Para">
        <option value="1" selected>Para 1</option>
        <option value="2">Para 2</option>
        <option value="3">Para 3</option>
        <option value="4">Para 4</option>
        <option value="5">Para 5</option>
        <option value="6">Para 6</option>
        <option value="7">Para 7</option>
        <option value="8">Para 8</option>
        <option value="9">Para 9</option>
        <option value="10">Para 10</option>
        <option value="11">Para 11</option>
        <option value="12">Para 12</option>
        <option value="13">Para 13</option>
        <option value="14">Para 14</option>
        <option value="15">Para 15</option>
        <option value="16">Para 16</option>
        <option value="17">Para 17</option>
        <option value="18">Para 18</option>
        <option value="19">Para 19</option>
        <option value="20">Para 20</option>
        <option value="21">Para 21</option>
        <option value="22">Para 22</option>
        <option value="23">Para 23</option>
        <option value="24">Para 24</option>
        <option value="25">Para 25</option>
        <option value="26">Para 26</option>
        <option value="27">Para 27</option>
        <option value="28">Para 28</option>
        <option value="29">Para 29</option>
        <option value="30">Para 30</option>
      </select>
        <div class="toolbar-volume-wrap">
          <span class="toolbar-volume-icon" aria-hidden="true">🔊</span>
          <input type="range" id="toolbar-volume" class="toolbar-volume-range" min="0" max="100" step="1" value="100" aria-label="Volume" />
        </div>
      </div>
      <div class="controls-right">
        <button type="button" class="btn btn-sm btn-offline-para" id="download-para-btn">📥 Download Para</button>
        <button type="button" class="btn btn-sm btn-install" id="install-btn">⬇ Install App</button>
        <button type="button" class="btn btn-sm btn-secondary" id="settings-btn">⚙ Settings</button>
      </div>
    </div>

    <div class="table-wrapper">
      <table class="ruku-table" id="ruku-table">
        <thead>
          <tr>
            <th>Ruku #</th>
            <th>Surah</th>
            <th>Verses</th>
            <th>Arabic</th>
            <th>Audio</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ruku-tbody">
          <!-- Rows rendered by app.js -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-backdrop" id="settings-modal-backdrop"></div>
    <div class="modal-content">
      <h2 class="modal-title">⚙ Settings</h2>
      <div class="settings-form">
        <div class="settings-row">
          <label>Role</label>
          <div class="settings-role-group">
            <button type="button" class="btn btn-sm settings-role-btn active" id="role-user-btn">👤 User</button>
            <button type="button" class="btn btn-sm settings-role-btn" id="role-admin-btn">🔐 Admin</button>
          </div>
          <span class="settings-role-badge" id="role-badge">User</span>
        </div>
        <div class="settings-row">
          <label>Appearance</label>
          <div class="settings-role-group" id="theme-mode-group">
            <button type="button" class="btn btn-sm settings-role-btn active" data-ui-theme="dark">🌙 Dark</button>
            <button type="button" class="btn btn-sm settings-role-btn" data-ui-theme="light">☀ Light</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-section-title">Show only recorded</span>
          <label class="settings-toggle-label">
            <input type="checkbox" id="show-only-recorded-para" />
            <span class="settings-toggle-switch"></span>
            Para (Juz)
          </label>
          <label class="settings-toggle-label">
            <input type="checkbox" id="show-only-recorded-ruku" />
            <span class="settings-toggle-switch"></span>
            Ruku
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-section-title">Playback</span>
          <div class="settings-playback-row">
            <label>After ruku ends</label>
            <div class="settings-role-group" id="playback-mode-group">
              <button type="button" class="btn btn-sm settings-role-btn active" data-mode="none">⏹ None</button>
              <button type="button" class="btn btn-sm settings-role-btn" data-mode="loop">🔁 Loop</button>
              <button type="button" class="btn btn-sm settings-role-btn" data-mode="next">⏭ Next</button>
            </div>
          </div>
          <div class="settings-speed-row">
            <label for="default-speed-select">Default speed</label>
            <select id="default-speed-select" class="settings-speed-select">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="1.75">1.75x</option>
              <option value="2">2x</option>
            </select>
          </div>
          <div class="settings-volume-row">
            <label for="settings-volume-range">Volume</label>
            <input type="range" id="settings-volume-range" class="settings-volume-range" min="0" max="100" step="1" value="100" aria-valuemin="0" aria-valuemax="100" />
            <span class="settings-volume-value" id="settings-volume-value">100%</span>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-section-title">Offline Downloads</span>
          <div class="settings-download-row">
            <button type="button" class="btn btn-sm btn-offline-para" id="download-all-btn">📥 Download All Paras</button>
            <span class="download-all-status" id="download-all-status"></span>
          </div>
        </div>
        <div class="settings-row settings-admin-section" id="admin-section" style="display:none">
          <label for="gh-token-input">GitHub Personal Access Token</label>
          <input type="password" id="gh-token-input" placeholder="Paste token here…" autocomplete="off">
        </div>
      </div>
      <div class="settings-actions">
        <button type="button" class="btn btn-sm btn-danger" id="clear-cache-btn">🔄 Reinstall App</button>
        <button type="button" class="btn btn-sm btn-secondary" id="settings-close-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
  <script>
    (function () {
      var btn = document.getElementById("install-btn");
      var deferred = null;
      var isReinstall = location.search.indexOf("reinstall=") !== -1;
      var isStandalone = window.matchMedia("(display-mode: standalone)").matches ||
                         window.navigator.standalone === true;

      // Clean the reinstall param from URL history
      if (isReinstall) {
        history.replaceState(null, "", location.pathname);
      }

      // Hide install button when running as installed PWA (unless reinstalling)
      if (isStandalone && !isReinstall) {
        btn.style.display = "none";
        return;
      }

      // Capture native install prompt when browser fires it
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferred = e;
        // If this is a reinstall flow, auto-trigger the prompt immediately
        if (isReinstall) {
          isReinstall = false;
          e.prompt();
          e.userChoice.then(function () { deferred = null; });
        }
      });

      window.addEventListener("appinstalled", function () {
        btn.style.display = "none";
        deferred = null;
      });

      // If reinstalling from standalone app, browser won't fire beforeinstallprompt
      // (it's already installed). Show instructions to complete the reinstall manually.
      if (isReinstall && isStandalone) {
        setTimeout(function () {
          var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if (isIOS) {
            alert("App data cleared! To complete reinstallation:\n\n1. Go to your Home Screen and delete this app\n2. Open Safari and visit this page again\n3. Tap Share \u{1F4E4} \u2192 \u201CAdd to Home Screen\u201D");
          } else {
            alert("App data cleared! To complete reinstallation:\n\n1. Remove this app from your Home Screen / App drawer\n2. Open Chrome and visit this page again\n3. Tap Install App");
          }
        }, 500);
      }

      btn.addEventListener("click", function () {
        if (deferred) {
          deferred.prompt();
          deferred.userChoice.then(function () { deferred = null; });
          return;
        }

        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          alert("To install on iOS:\n\n1. Tap the Share button \u{1F4E4} at the bottom of Safari\n2. Tap \u201CAdd to Home Screen\u201D\n3. Tap \u201CAdd\u201D");
          return;
        }

        alert("To install:\n\nIn Chrome: tap the menu (\u22EE) then \u201CAdd to Home Screen\u201D or \u201CInstall app\u201D\nIn Edge: tap the menu then \u201CApps \u2192 Install this site as an app\u201D");
      });
    })();
  </script>
</body>
</html>
