plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.mohsingdp.marifatulquran'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mohsingdp.marifatulquran'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { compose true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { checkReleaseBuilds false; abortOnError false }
    packaging {
        resources {
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/DEPENDENCIES',
                'META-INF/androidx/**',
                'META-INF/**/LICENSE*',
                'META-INF/**/NOTICE*',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json',
            ]
        }
    }
}
dependencies {
    implementation project(':core')
    def composeBom = platform('androidx.compose:compose-bom:2026.06.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // Lean-by-default (budget): NO navigation-compose, material-icons-core, lifecycle-viewmodel-compose,
    // or datastore (its native .so cost ~ the budget; Phase 5 resume uses framework SharedPreferences).
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
    // media3-ui removed (unused — we use Compose + MediaSessionService notification)

    testImplementation 'junit:junit:4.13.2'
}
