<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Audio Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a96e;
    --gold-dim: #a07840;
    --bg: #0a0a0f;
    --card: #13131e;
    --card2: #0e0e18;
    --border: #1e1e2e;
    --border2: #1a1a26;
    --text: #e8e0d0;
    --muted: #4a4a5a;
    --dark: #2a2a3a;
    --darker: #1a1a28;
    --red: #e05555;
    --green: #5cb85c;
  }

  body { min-height: 100vh; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; font-family: 'Cormorant Garamond', Georgia, serif; padding: 24px; }
  .wrap { width: 100%; max-width: 520px; }

  .header { text-align: center; margin-bottom: 28px; }
  .bismillah { font-size: 30px; color: var(--gold); letter-spacing: 0.1em; }
  .subtitle { font-size: 10px; color: var(--muted); letter-spacing: 0.45em; text-transform: uppercase; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

  .card { background: linear-gradient(145deg, var(--card), var(--card2)); border: 1px solid var(--border); border-radius: 20px; padding: 28px; box-shadow: 0 0 60px rgba(201,169,110,0.05), inset 0 1px 0 rgba(255,255,255,0.03); }

  .now-playing { text-align: center; margin-bottom: 22px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dark); margin-bottom: 10px; transition: background 0.4s, box-shadow 0.4s; }
  .dot.active { background: var(--gold); box-shadow: 0 0 14px var(--gold); }
  .track-name { color: var(--text); font-size: 16px; font-weight: 400; letter-spacing: 0.05em; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .no-track { color: var(--dark); font-size: 13px; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }

  /* Waveform */
  #waveformWrap { position: relative; margin-bottom: 6px; user-select: none; }
  #waveCanvas { display: block; width: 100%; height: 64px; border-radius: 8px; background: var(--darker); cursor: crosshair; }

  /* Split markers on waveform */
  .marker-line {
    position: absolute; top: 0; width: 2px; height: 100%;
    background: var(--gold); pointer-events: none; transform: translateX(-1px);
  }
  .marker-line::after {
    content: attr(data-label);
    position: absolute; top: 2px; left: 4px;
    font-size: 9px; color: var(--gold); font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  /* Playhead */
  #playhead { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.4); pointer-events: none; }

  .times { display: flex; justify-content: space-between; margin-top: 4px; }
  .times span { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 18px 0 20px; }
  .btn-icon { background: none; border: none; cursor: pointer; color: var(--dark); padding: 8px; transition: color 0.2s; display: flex; align-items: center; justify-content: center; }
  .btn-icon.enabled { color: var(--muted); }
  .btn-icon.enabled:hover { color: var(--gold); }
  .btn-play { width: 56px; height: 56px; border-radius: 50%; background: var(--darker); border: none; cursor: default; display: flex; align-items: center; justify-content: center; color: var(--bg); transition: all 0.3s; }
  .btn-play.ready { background: linear-gradient(145deg, var(--gold), var(--gold-dim)); box-shadow: 0 0 24px rgba(201,169,110,0.3); cursor: pointer; }

  .volume-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  input[type=range] { flex: 1; height: 2px; accent-color: var(--gold); cursor: pointer; -webkit-appearance: none; appearance: none; background: linear-gradient(to right, var(--gold) 100%, var(--darker) 100%) no-repeat; background-size: 100% 100%; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); cursor: pointer; }

  .dropzone { border: 1px dashed var(--dark); border-radius: 12px; padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .dropzone:hover, .dropzone.over { border-color: var(--gold); background: rgba(201,169,110,0.04); }
  .dropzone span { font-size: 11px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  .dropzone.over span { color: var(--gold); }

  /* Splitter Panel */
  .splitter { margin-top: 14px; background: linear-gradient(145deg, var(--card), var(--card2)); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: none; }
  .splitter.visible { display: block; }

  .splitter-header { padding: 14px 18px; border-bottom: 1px solid var(--border2); display: flex; align-items: center; justify-content: space-between; }
  .splitter-title { font-size: 11px; color: var(--gold); letter-spacing: 0.35em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  .splitter-actions { display: flex; gap: 8px; }

  .btn-sm {
    font-size: 10px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 5px 12px; border-radius: 6px; border: 1px solid;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-add { color: var(--gold); border-color: var(--gold); background: transparent; }
  .btn-add:hover { background: rgba(201,169,110,0.1); }
  .btn-clear { color: var(--muted); border-color: var(--dark); background: transparent; }
  .btn-clear:hover { color: var(--red); border-color: var(--red); }

  /* Marker list */
  .marker-list { padding: 10px 18px; }
  .marker-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--border2);
  }
  .marker-item:last-child { border-bottom: none; }
  .marker-label { font-size: 11px; color: var(--gold); font-family: 'JetBrains Mono', monospace; min-width: 18px; }
  .marker-time-input {
    background: var(--darker); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 4px 8px; width: 80px; outline: none; transition: border-color 0.2s;
  }
  .marker-time-input:focus { border-color: var(--gold); }
  .marker-range { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; flex: 1; }
  .btn-del { background: none; border: none; cursor: pointer; color: var(--dark); transition: color 0.2s; padding: 4px; }
  .btn-del:hover { color: var(--red); }
  .btn-jump { background: none; border: none; cursor: pointer; color: var(--dark); transition: color 0.2s; padding: 4px; }
  .btn-jump:hover { color: var(--muted); }

  /* Segments */
  .cut-region { position: absolute; top: 0; bottom: 0; background: rgba(220, 70, 70, 0.28);
                border-left: 1px solid #d4544f; border-right: 1px solid #d4544f; pointer-events: none; }
  .cut-item .marker-range { color: #d4544f; }
  .segments-area { border-top: 1px solid var(--border2); padding: 10px 18px 14px; }
  .segments-title { font-size: 10px; color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 10px; }
  .segment-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border2); }
  .segment-item:last-child { border-bottom: none; }
  .seg-name-input {
    background: var(--darker); border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 13px;
    padding: 4px 8px; flex: 1; outline: none; transition: border-color 0.2s; min-width: 0;
  }
  .seg-name-input:focus { border-color: var(--gold); }
  .seg-dur { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; min-width: 38px; text-align: right; }

  .btn-dl {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid #2a4a2a; background: rgba(92,184,92,0.06);
    color: var(--green); cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .btn-dl:hover { background: rgba(92,184,92,0.15); border-color: var(--green); }
  .btn-dl.processing { color: var(--muted); border-color: var(--dark); cursor: wait; }

  .btn-dl-all {
    width: 100%; margin-top: 12px;
    font-size: 10px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.25em;
    text-transform: uppercase; padding: 10px;
    border-radius: 8px; border: 1px solid var(--gold);
    background: rgba(201,169,110,0.06); color: var(--gold);
    cursor: pointer; transition: all 0.2s;
  }
  .btn-dl-all:hover { background: rgba(201,169,110,0.12); }

  /* Playlist */
  .playlist { margin-top: 14px; background: linear-gradient(145deg, var(--card), var(--card2)); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: none; }
  .playlist.visible { display: block; }
  .pl-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; cursor: pointer; border-bottom: 1px solid var(--border2); transition: background 0.2s; }
  .pl-item:last-child { border-bottom: none; }
  .pl-item:hover { background: rgba(201,169,110,0.04); }
  .pl-item.active { background: rgba(201,169,110,0.08); }
  .pl-icon { width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
  .pl-item.active .pl-icon { background: linear-gradient(145deg, var(--gold), var(--gold-dim)); }
  .pl-name { flex: 1; font-size: 13px; color: var(--muted); letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s; }
  .pl-item.active .pl-name { color: var(--gold); }
  .pl-time { font-size: 10px; color: var(--dark); font-family: 'JetBrains Mono', monospace; min-width: 28px; text-align: right; }

  .eq { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
  .eq-bar { width: 2px; background: var(--bg); border-radius: 1px; }
  .eq-bar:nth-child(1) { animation: eq 0.6s ease-in-out infinite alternate; height: 6px; }
  .eq-bar:nth-child(2) { animation: eq 0.75s ease-in-out infinite alternate; height: 9px; }
  .eq-bar:nth-child(3) { animation: eq 0.5s ease-in-out infinite alternate; height: 5px; }
  @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

  .no-markers { font-size: 12px; color: var(--dark); font-family: 'JetBrains Mono', monospace; text-align: center; padding: 12px 0; letter-spacing: 0.1em; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="bismillah">﷽</div>
    <div class="subtitle">Quran Audio Player & Splitter</div>
  </div>

  <div class="card">
    <div class="now-playing">
      <div class="dot" id="dot"></div>
      <div class="track-name" id="trackName" style="display:none"></div>
      <div class="no-track" id="noTrack">No track loaded</div>
    </div>

    <!-- Waveform -->
    <div id="waveformWrap">
      <canvas id="waveCanvas"></canvas>
      <div id="playhead"></div>
      <!-- marker lines injected here -->
    </div>

    <div class="times">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="btn-icon" id="btnPrev" title="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn-play" id="btnPlay">
        <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="margin-left:3px"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn-icon" id="btnNext" title="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#4a4a5a"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#4a4a5a"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

    <div class="dropzone" id="dropzone">
      <span>Click or drop .opus / audio files here</span>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.opus,.ogg" multiple style="display:none">
  </div>

  <!-- Splitter -->
  <div class="splitter" id="splitterPanel">
    <div class="splitter-header">
      <div class="splitter-title">✂ Audio Splitter</div>
      <div class="splitter-actions">
        <button class="btn-sm btn-add" id="btnAddMarker">+ Add Split Point</button>
        <button class="btn-sm btn-add" id="btnCutStart">✂ Cut From Here</button>
        <button class="btn-sm btn-clear" id="btnClearMarkers">Clear All</button>
      </div>
    </div>

    <div class="marker-list" id="markerList">
      <div class="no-markers" id="noMarkersMsg">Click "+ Add Split Point" or click on the waveform to add a split — current playhead position will be used</div>
    </div>

    <div class="marker-list" id="cutList" style="display:none"></div>

    <div class="segments-area" id="segmentsArea" style="display:none">
      <div class="segments-title">Segments to export</div>
      <div id="segmentList"></div>
      <button class="btn-dl-all" id="btnDlAll">⬇ Download All Segments</button>
    </div>
  </div>

  <!-- Playlist -->
  <div class="playlist" id="playlist"></div>

  <p id="queryLoadHint" style="display:none;margin-top:16px;text-align:center;font-size:11px;color:#4a4a5a;font-family:'JetBrains Mono',monospace;letter-spacing:0.12em;"></p>
</div>

<audio id="audio"></audio>

<script src="data.js"></script>
<script>
const audio = document.getElementById('audio');
const btnPlay = document.getElementById('btnPlay');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const iconPlay = document.getElementById('iconPlay');
const iconPause = document.getElementById('iconPause');
const waveCanvas = document.getElementById('waveCanvas');
const waveformWrap = document.getElementById('waveformWrap');
const playheadEl = document.getElementById('playhead');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const trackNameEl = document.getElementById('trackName');
const noTrackEl = document.getElementById('noTrack');
const dot = document.getElementById('dot');
const volumeSlider = document.getElementById('volume');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const playlist = document.getElementById('playlist');
const splitterPanel = document.getElementById('splitterPanel');
const markerList = document.getElementById('markerList');
const noMarkersMsg = document.getElementById('noMarkersMsg');
const segmentsArea = document.getElementById('segmentsArea');
const segmentList = document.getElementById('segmentList');
const btnAddMarker = document.getElementById('btnAddMarker');
const btnCutStart = document.getElementById('btnCutStart');
const cutList = document.getElementById('cutList');
const btnClearMarkers = document.getElementById('btnClearMarkers');
const btnDlAll = document.getElementById('btnDlAll');
const queryLoadHint = document.getElementById('queryLoadHint');

const ctx = waveCanvas.getContext('2d');

let files = [];
let currentIndex = -1;
let objUrl = null;
let audioCtx = null;
let decodedBuffer = null;
let splitMarkers = []; // sorted list of times in seconds
let cutRegions = [];   // [{start, end}] spans removed from every export, joined seamlessly
let pendingCutStart = null;
let segmentNames = [];
let currentFileObj = null;
let animFrame;

function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function fmtFull(s) {
  if (!s || isNaN(s)) return '0:00.0';
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1).padStart(4,'0');
  return `${m}:${sec}`;
}

// ── Waveform ──────────────────────────────────────────────────────────────────
function drawWaveform(buffer) {
  const W = waveCanvas.offsetWidth * window.devicePixelRatio;
  const H = 64 * window.devicePixelRatio;
  waveCanvas.width = W;
  waveCanvas.height = H;

  const data = buffer.getChannelData(0);
  const step = Math.ceil(data.length / W);
  const mid = H / 2;

  ctx.clearRect(0, 0, W, H);

  for (let i = 0; i < W; i++) {
    let min = 0, max = 0;
    for (let j = 0; j < step; j++) {
      const v = data[i * step + j] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    // Color by position
    const pct = i / W;
    ctx.fillStyle = `hsl(${38 + pct * 10}, ${40 + pct * 20}%, ${28 + pct * 12}%)`;
    ctx.fillRect(i, mid + min * mid * 0.9, 1, Math.max(1, (max - min) * mid * 0.9));
  }
}

function drawPlayhead() {
  const dur = audio.duration;
  if (!dur) return;
  const pct = audio.currentTime / dur;
  const W = waveCanvas.offsetWidth;
  playheadEl.style.left = (pct * W) + 'px';
  updateMarkerLinesPos();
  cancelAnimationFrame(animFrame);
  if (!audio.paused) animFrame = requestAnimationFrame(drawPlayhead);
}

function updateMarkerLinesPos() {
  const dur = audio.duration || 1;
  const W = waveCanvas.offsetWidth;
  document.querySelectorAll('.marker-line').forEach(el => {
    const t = parseFloat(el.dataset.time);
    el.style.left = ((t / dur) * W) + 'px';
  });
}

// ── Markers ───────────────────────────────────────────────────────────────────
function addSplitAt(time) {
  const dur = audio.duration || 0;
  if (!dur) return;
  time = Math.max(0.1, Math.min(dur - 0.1, parseFloat(time.toFixed(2))));
  if (splitMarkers.includes(time)) return;
  splitMarkers.push(time);
  splitMarkers.sort((a, b) => a - b);
  renderMarkers();
  renderMarkerLines();
  renderSegments();
}

function removeMarker(index) {
  splitMarkers.splice(index, 1);
  renderMarkers();
  renderMarkerLines();
  renderSegments();
}

function renderMarkers() {
  markerList.innerHTML = '';
  if (!splitMarkers.length) {
    markerList.appendChild(noMarkersMsg);
    noMarkersMsg.style.display = 'block';
    return;
  }
  noMarkersMsg.style.display = 'none';

  splitMarkers.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'marker-item';
    row.innerHTML = `
      <span class="marker-label">#${i+1}</span>
      <input class="marker-time-input" type="text" value="${fmtFull(t)}" data-idx="${i}" title="Edit time (m:ss.s)">
      <span class="marker-range">← split point at ${fmtFull(t)}</span>
      <button class="btn-jump" title="Jump to" data-t="${t}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      </button>
      <button class="btn-del" title="Remove" data-idx="${i}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    `;
    row.querySelector('.btn-del').addEventListener('click', () => removeMarker(i));
    row.querySelector('.btn-jump').addEventListener('click', () => { audio.currentTime = t; drawPlayhead(); });
    row.querySelector('.marker-time-input').addEventListener('change', function() {
      const parsed = parseTimeInput(this.value);
      if (!isNaN(parsed) && parsed > 0) {
        splitMarkers[i] = parsed;
        splitMarkers.sort((a, b) => a - b);
        renderMarkers(); renderMarkerLines(); renderSegments();
      }
    });
    markerList.appendChild(row);
  });
}

function parseTimeInput(str) {
  // m:ss.s or seconds
  const parts = str.trim().split(':');
  if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  return parseFloat(str);
}

function renderMarkerLines() {
  document.querySelectorAll('.marker-line').forEach(e => e.remove());
  const dur = audio.duration || 1;
  const W = waveCanvas.offsetWidth;
  splitMarkers.forEach((t, i) => {
    const line = document.createElement('div');
    line.className = 'marker-line';
    line.dataset.time = t;
    line.dataset.label = `#${i+1}`;
    line.style.left = ((t / dur) * W) + 'px';
    waveformWrap.appendChild(line);
  });
}

// ── Cut regions ──────────────────────────────────────────────────────────────
// A split point divides the audio; a cut region takes a piece OUT of it. Cuts apply to
// every export, so a passage removed here disappears from whichever segment contained it
// and the audio either side is joined.

/** Two presses: the first fixes the start, the second closes the region at the playhead. */
function toggleCutAt(time) {
  const dur = audio.duration || 0;
  if (!dur) return;
  time = Math.max(0, Math.min(dur, parseFloat(time.toFixed(2))));
  if (pendingCutStart === null) {
    pendingCutStart = time;
  } else {
    const start = Math.min(pendingCutStart, time);
    const end = Math.max(pendingCutStart, time);
    pendingCutStart = null;
    if (end - start >= 0.05) { cutRegions.push({ start, end }); normaliseCuts(); }
  }
  renderCuts(); renderCutRegions(); renderSegments(); updateCutButton();
}

/** Sort and merge overlaps, so joined output never depends on the order they were added. */
function normaliseCuts() {
  cutRegions.sort((a, b) => a.start - b.start);
  const out = [];
  for (const c of cutRegions) {
    const prev = out[out.length - 1];
    if (prev && c.start <= prev.end) prev.end = Math.max(prev.end, c.end);
    else out.push({ start: c.start, end: c.end });
  }
  cutRegions = out;
}

function removeCut(i) {
  cutRegions.splice(i, 1);
  renderCuts(); renderCutRegions(); renderSegments();
}

function updateCutButton() {
  btnCutStart.textContent = pendingCutStart === null
    ? '✂ Cut From Here'
    : '✂ End Cut (' + fmtFull(pendingCutStart) + ' →)';
}

function renderCuts() {
  cutList.innerHTML = '';
  cutList.style.display = cutRegions.length ? 'block' : 'none';
  cutRegions.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'marker-item cut-item';
    row.innerHTML = '<span class="marker-label">✂' + (i + 1) + '</span>' +
      '<input class="marker-time-input cut-from" type="text" value="' + fmtFull(c.start) + '" title="Cut starts">' +
      '<input class="marker-time-input cut-to" type="text" value="' + fmtFull(c.end) + '" title="Cut ends">' +
      '<span class="marker-range">removed — ' + fmt(c.end - c.start) + '</span>' +
      '<button class="btn-jump" title="Jump to start"></button>' +
      '<button class="btn-del" title="Keep this part"></button>';
    row.querySelector('.btn-jump').innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>';
    row.querySelector('.btn-del').innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
    row.querySelector('.btn-jump').addEventListener('click', () => { audio.currentTime = c.start; drawPlayhead(); });
    row.querySelector('.btn-del').addEventListener('click', () => removeCut(i));
    const edit = () => {
      const a = parseTimeInput(row.querySelector('.cut-from').value);
      const b = parseTimeInput(row.querySelector('.cut-to').value);
      if (!isNaN(a) && !isNaN(b) && b > a) {
        cutRegions[i] = { start: a, end: b };
        normaliseCuts(); renderCuts(); renderCutRegions(); renderSegments();
      } else { renderCuts(); }
    };
    row.querySelector('.cut-from').addEventListener('change', edit);
    row.querySelector('.cut-to').addEventListener('change', edit);
    cutList.appendChild(row);
  });
}

function renderCutRegions() {
  document.querySelectorAll('.cut-region').forEach(e => e.remove());
  const dur = audio.duration || 1;
  const W = waveCanvas.offsetWidth;
  cutRegions.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cut-region';
    el.style.left = ((c.start / dur) * W) + 'px';
    el.style.width = Math.max(1, ((c.end - c.start) / dur) * W) + 'px';
    waveformWrap.appendChild(el);
  });
}

/** The parts of [start,end] that survive the cuts, in order. */
function keptSpans(start, end) {
  let spans = [{ start, end }];
  for (const c of cutRegions) {
    const next = [];
    for (const s of spans) {
      if (c.end <= s.start || c.start >= s.end) { next.push(s); continue; }
      if (c.start > s.start) next.push({ start: s.start, end: c.start });
      if (c.end < s.end) next.push({ start: c.end, end: s.end });
    }
    spans = next;
  }
  return spans.filter(s => s.end - s.start > 0.001);
}

// ── Segments ─────────────────────────────────────────────────────────────────
function getSegments() {
  const dur = audio.duration || 0;
  const points = [0, ...splitMarkers, dur];
  return points.slice(0, -1).map((start, i) => ({
    start,
    end: points[i + 1],
    name: segmentNames[i] || `${(currentFileObj?.name || 'segment')}_part${i+1}`
  }));
}

function renderSegments() {
  const segs = getSegments();
  if (!segs.length || !audio.duration) { segmentsArea.style.display = 'none'; return; }
  segmentsArea.style.display = 'block';
  segmentList.innerHTML = '';
  segs.forEach((seg, i) => {
    const dur = keptSpans(seg.start, seg.end).reduce((a, sp) => a + (sp.end - sp.start), 0);
    const item = document.createElement('div');
    item.className = 'segment-item';
    item.innerHTML = `
      <span style="font-size:10px;color:var(--gold);font-family:'JetBrains Mono',monospace;min-width:18px">${i+1}</span>
      <input class="seg-name-input" type="text" value="${seg.name}" placeholder="Segment name" data-idx="${i}">
      <span class="seg-dur">${fmt(dur)}</span>
      <button class="btn-dl" data-idx="${i}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Save
      </button>
    `;
    item.querySelector('.seg-name-input').addEventListener('input', function() {
      segmentNames[i] = this.value;
    });
    item.querySelector('.btn-dl').addEventListener('click', () => exportSegment(i));
    segmentList.appendChild(item);
  });
}

// ── Export ────────────────────────────────────────────────────────────────────
async function exportSegment(idx) {
  if (!decodedBuffer) return;
  const segs = getSegments();
  const seg = segs[idx];
  const btn = segmentList.querySelectorAll('.btn-dl')[idx];
  btn.classList.add('processing');
  btn.textContent = '...';

  try {
    const sampleRate = decodedBuffer.sampleRate;
    const numCh = decodedBuffer.numberOfChannels;

    // Copy only the spans that survive the cuts, laid end to end. Nothing is faded across
    // the join: these are spoken lectures, and a cut is meant to land in a pause.
    const spans = keptSpans(seg.start, seg.end);
    if (!spans.length) throw new Error('every part of this segment has been cut');
    const length = spans.reduce(
      (a, sp) => a + (Math.floor(sp.end * sampleRate) - Math.floor(sp.start * sampleRate)), 0);

    const offCtx = new OfflineAudioContext(numCh, length, sampleRate);
    const segBuffer = offCtx.createBuffer(numCh, length, sampleRate);
    for (let ch = 0; ch < numCh; ch++) {
      const src = decodedBuffer.getChannelData(ch);
      const dst = segBuffer.getChannelData(ch);
      let at = 0;
      for (const sp of spans) {
        const from = Math.floor(sp.start * sampleRate);
        const to = Math.floor(sp.end * sampleRate);
        dst.set(src.subarray(from, to), at);
        at += to - from;
      }
    }

    // Match the recordings in audio/: Opus in Ogg. WAV only if the browser cannot encode.
    let blob, ext;
    try {
      const at48k = sampleRate === 48000 ? segBuffer : await resampleTo48k(segBuffer);
      blob = await bufferToOpus(at48k);
      ext = '.opus';
    } catch (err) {
      console.warn('Opus encoding unavailable, falling back to WAV:', err);
      blob = bufferToWav(segBuffer);
      ext = '.wav';
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (segmentNames[idx] || seg.name) + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e) {
    console.error(e);
    alert('Could not export this segment: ' + e.message);
  }

  btn.classList.remove('processing');
  btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Save`;
}

async function exportAll() {
  const segs = getSegments();
  for (let i = 0; i < segs.length; i++) {
    await exportSegment(i);
    await new Promise(r => setTimeout(r, 400));
  }
}

// ── Ogg Opus encoding ────────────────────────────────────────────────────────
// The recordings in audio/ are Opus in an Ogg container at 48 kHz, and exports should match
// so a trimmed file can replace one directly. Chrome's MediaRecorder cannot produce that --
// it offers WebM-Opus, and a WebM renamed .opus is not an Ogg file and would not decode
// where the real ones do. WebCodecs encodes the Opus packets, and the Ogg framing below is
// written by hand, which is the whole of the difference between the two.

const OGG_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let r = i << 24;
    for (let j = 0; j < 8; j++) r = (r & 0x80000000) ? ((r << 1) ^ 0x04c11db7) : (r << 1);
    t[i] = r >>> 0;
  }
  return t;
})();

/** Ogg's CRC32: no input/output reflection and no final xor, unlike the common one. */
function oggCrc(bytes) {
  let crc = 0;
  for (let i = 0; i < bytes.length; i++) {
    crc = ((crc << 8) ^ OGG_CRC_TABLE[((crc >>> 24) & 0xff) ^ bytes[i]]) >>> 0;
  }
  return crc >>> 0;
}

function oggPage(serial, seq, headerType, granule, packets) {
  const laces = [];
  for (const pk of packets) {
    let n = pk.length;
    while (n >= 255) { laces.push(255); n -= 255; }
    laces.push(n);
  }
  const bodyLen = packets.reduce((a, pk) => a + pk.length, 0);
  const page = new Uint8Array(27 + laces.length + bodyLen);
  const dv = new DataView(page.buffer);
  page.set([0x4f, 0x67, 0x67, 0x53], 0);      // "OggS"
  page[4] = 0;                                 // stream structure version
  page[5] = headerType;                        // 2 = first page, 4 = last, 0 = middle
  dv.setUint32(6, granule >>> 0, true);        // granule position, 64-bit little endian
  dv.setUint32(10, Math.floor(granule / 4294967296), true);
  dv.setUint32(14, serial, true);
  dv.setUint32(18, seq, true);
  dv.setUint32(22, 0, true);                   // CRC is computed over the page with 0 here
  page[26] = laces.length;
  page.set(laces, 27);
  let off = 27 + laces.length;
  for (const pk of packets) { page.set(pk, off); off += pk.length; }
  dv.setUint32(22, oggCrc(page), true);
  return page;
}

function opusHeadPacket(channels, preSkip) {
  const b = new Uint8Array(19);
  b.set([0x4f, 0x70, 0x75, 0x73, 0x48, 0x65, 0x61, 0x64], 0); // "OpusHead"
  b[8] = 1;                                    // version
  b[9] = channels;
  const dv = new DataView(b.buffer);
  dv.setUint16(10, preSkip, true);
  dv.setUint32(12, 48000, true);               // original input rate, informational
  dv.setUint16(16, 0, true);                   // output gain
  b[18] = 0;                                   // channel mapping family
  return b;
}

function opusTagsPacket() {
  const vendor = new TextEncoder().encode('Marifatul Quran trim-audio');
  const b = new Uint8Array(8 + 4 + vendor.length + 4);
  b.set(new TextEncoder().encode('OpusTags'), 0);
  const dv = new DataView(b.buffer);
  dv.setUint32(8, vendor.length, true);
  b.set(vendor, 12);
  dv.setUint32(12 + vendor.length, 0, true);   // zero user comments
  return b;
}

/** Opus is always 48 kHz; anything else has to be resampled before encoding. */
async function resampleTo48k(buffer) {
  const frames = Math.ceil(buffer.length * 48000 / buffer.sampleRate);
  const off = new OfflineAudioContext(buffer.numberOfChannels, frames, 48000);
  const src = off.createBufferSource();
  src.buffer = buffer;
  src.connect(off.destination);
  src.start();
  return off.startRendering();
}

/** AudioBuffer (48 kHz) -> Blob of Ogg Opus. */
async function bufferToOpus(buffer) {
  if (typeof AudioEncoder === 'undefined') throw new Error('WebCodecs AudioEncoder unavailable');
  const channels = Math.min(buffer.numberOfChannels, 2);
  const SAMPLE_RATE = 48000;
  const FRAME = 960;                           // 20 ms, the Opus packet size used here
  const PRE_SKIP = 312;                        // encoder priming samples, discarded on decode

  const packets = [];
  let encErr = null;
  const encoder = new AudioEncoder({
    output: (chunk) => { const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d); packets.push(d); },
    error: (e) => { encErr = e; }
  });
  encoder.configure({ codec: 'opus', sampleRate: SAMPLE_RATE, numberOfChannels: channels, bitrate: 64000 });

  const total = buffer.length;
  const CHUNK = FRAME * 25;                    // feed in ~half-second blocks
  for (let off = 0; off < total; off += CHUNK) {
    const frames = Math.min(CHUNK, total - off);
    const planar = new Float32Array(channels * frames);
    for (let ch = 0; ch < channels; ch++) {
      planar.set(buffer.getChannelData(ch).subarray(off, off + frames), ch * frames);
    }
    encoder.encode(new AudioData({
      format: 'f32-planar', sampleRate: SAMPLE_RATE, numberOfFrames: frames,
      numberOfChannels: channels, timestamp: Math.round((off / SAMPLE_RATE) * 1e6), data: planar
    }));
  }
  await encoder.flush();
  encoder.close();
  if (encErr) throw encErr;

  const serial = (Math.random() * 0xffffffff) >>> 0;
  const pages = [
    oggPage(serial, 0, 2, 0, [opusHeadPacket(channels, PRE_SKIP)]),
    oggPage(serial, 1, 0, 0, [opusTagsPacket()])
  ];
  let seq = 2, granule = 0, batch = [], laceCount = 0;
  const flush = (last) => {
    if (!batch.length) return;
    pages.push(oggPage(serial, seq++, last ? 4 : 0, granule, batch));
    batch = []; laceCount = 0;
  };
  for (let i = 0; i < packets.length; i++) {
    const pk = packets[i];
    const laces = Math.floor(pk.length / 255) + 1;
    if (laceCount + laces > 250) flush(false);  // a page carries at most 255 lacing values
    batch.push(pk); laceCount += laces;
    granule += FRAME;
    if (i === packets.length - 1) flush(true);
  }
  if (batch.length) flush(true);
  if (pages.length === 2) pages.push(oggPage(serial, seq, 4, granule, [new Uint8Array(0)]));

  return new Blob(pages, { type: 'audio/ogg' });
}

function bufferToWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const numFrames = buffer.length;
  const bytePerSample = 2;
  const blockAlign = numCh * bytePerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = numFrames * blockAlign;
  const ab = new ArrayBuffer(44 + dataSize);
  const view = new DataView(ab);

  function write(offset, str) { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); }
  write(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  write(8, 'WAVE');
  write(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytePerSample * 8, true);
  write(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < numFrames; i++) {
    for (let ch = 0; ch < numCh; ch++) {
      const s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

// ── File Loading ──────────────────────────────────────────────────────────────
async function decodeAudio(file) {
  if (!audioCtx) audioCtx = new AudioContext();
  const arrayBuffer = await file.arrayBuffer();
  decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  drawWaveform(decodedBuffer);
}

function loadTrack(index, opts) {
  opts = opts || {};
  const autoplay = opts.autoplay !== false;
  if (index < 0 || index >= files.length) return;
  if (objUrl) URL.revokeObjectURL(objUrl);
  currentFileObj = files[index];
  objUrl = URL.createObjectURL(currentFileObj.file);
  audio.src = objUrl;
  audio.volume = parseFloat(volumeSlider.value);
  currentIndex = index;
  splitMarkers = [];
  cutRegions = []; pendingCutStart = null;
  renderCuts(); renderCutRegions(); updateCutButton();
  segmentNames = [];

  if (autoplay) {
    audio.play().catch(() => { updateUI(); });
  }
  updateUI();
  renderPlaylist();
  splitterPanel.classList.add('visible');
  renderMarkers();
  renderMarkerLines();
  renderSegments();

  // Decode for waveform + export
  decodeAudio(currentFileObj.file);
}

function addFiles(incoming) {
  const valid = Array.from(incoming).filter(f =>
    f.type.includes('audio') || f.name.endsWith('.opus') || f.name.endsWith('.ogg')
  );
  if (!valid.length) return;
  valid.forEach(f => files.push({ file: f, name: f.name.replace(/\.[^.]+$/, '') }));
  renderPlaylist();
  if (currentIndex < 0) loadTrack(0);
}

// ── UI Updates ────────────────────────────────────────────────────────────────
function updateUI() {
  const has = currentIndex >= 0;
  const playing = !audio.paused;
  dot.classList.toggle('active', playing);
  iconPlay.style.display = playing ? 'none' : 'block';
  iconPause.style.display = playing ? 'block' : 'none';
  btnPlay.classList.toggle('ready', has);
  trackNameEl.style.display = has ? 'block' : 'none';
  noTrackEl.style.display = has ? 'none' : 'block';
  if (has) trackNameEl.textContent = files[currentIndex].name;
  btnPrev.classList.toggle('enabled', currentIndex > 0);
  btnNext.classList.toggle('enabled', currentIndex < files.length - 1);
}

function renderPlaylist() {
  playlist.classList.toggle('visible', files.length > 0);
  playlist.innerHTML = '';
  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'pl-item' + (i === currentIndex ? ' active' : '');
    item.innerHTML = `
      <div class="pl-icon">
        ${i === currentIndex && !audio.paused
          ? `<div class="eq"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>`
          : `<svg width="9" height="9" viewBox="0 0 10 10" fill="${i === currentIndex ? '#0a0a0f' : '#4a4a5a'}" style="margin-left:1px"><path d="M2 1l7 4-7 4z"/></svg>`}
      </div>
      <div class="pl-name">${f.name}</div>
      <div class="pl-time">${i === currentIndex ? fmt(audio.currentTime) : ''}</div>
    `;
    item.addEventListener('click', () => loadTrack(i));
    playlist.appendChild(item);
  });
}

// ── Events ────────────────────────────────────────────────────────────────────
audio.addEventListener('timeupdate', () => {
  currentTimeEl.textContent = fmt(audio.currentTime);

audio.addEventListener('pause', () => { updateUI(); renderPlaylist(); });

btnPlay.addEventListener('click', () => {

// Waveform click → seek + optionally add marker if holding Shift
waveCanvas.addEventListener('click', (e) => {

  const ratio = (e.clientX - rect.left) / rect.width;
  if (e.shiftKey) {
    addSplitAt(ratio * audio.duration);
  } else {
    audio.currentTime = ratio * audio.duration;
    drawPlayhead();
  }
});

btnAddMarker.addEventListener('click', () => addSplitAt(audio.currentTime || 0));

btnClearMarkers.addEventListener('click', () => {

dropzone.addEventListener('click', () => fileInput.click());

window.addEventListener('resize', () => { if (decodedBuffer) { drawWaveform(decodedBuffer); renderMarkerLines(); } });


// ── Keyboard Shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  // Don't fire when typing in an input
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    if (currentIndex < 0) return;
    audio.paused ? audio.play() : audio.pause();
  }

  if (e.code === 'ArrowRight') {
    e.preventDefault();
    if (!audio.duration) return;
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    showNudge('+5s');
    drawPlayhead();
  }

  if (e.code === 'ArrowLeft') {
    e.preventDefault();
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, audio.currentTime - 5);
    showNudge('-5s');
    drawPlayhead();
  }

  if (e.altKey && e.code === 'KeyS') {
    e.preventDefault();
    if (!audio.duration) return;
    addSplitAt(audio.currentTime);
    showNudge('✂ split');
  }
});

// Brief on-screen nudge indicator
let nudgeTimer;
function showNudge(text) {
  let el = document.getElementById('nudgeToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'nudgeToast';
    el.style.cssText = `
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(8px);
      background:rgba(201,169,110,0.12); border:1px solid rgba(201,169,110,0.3);
      color:#c9a96e; font-family:'JetBrains Mono',monospace; font-size:13px;
      letter-spacing:0.2em; padding:7px 20px; border-radius:20px;
      pointer-events:none; opacity:0; transition:opacity 0.15s, transform 0.15s;
      backdrop-filter:blur(8px); z-index:9999;
    `;
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  el.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(8px)';
  }, 700);
}

// ── Deep link: player.html?para=N&ruku=R3 ──────────────────────────────────────
async function initFromParaRukuQuery() {
  if (typeof QURAN_DATA === 'undefined') return;

  const qp = new URLSearchParams(window.location.search);
  let row = null;
  let para = parseInt(qp.get('para'), 10);
  let ruku = qp.get('ruku');

  if (ruku != null && String(ruku).trim() !== '') {
    try {
      ruku = decodeURIComponent(String(ruku)).trim();
    } catch (e) {
      ruku = String(ruku).trim();
    }
  } else {
    ruku = '';
  }
  if (!isNaN(para) && para >= 1 && para <= 30 && ruku) {
    row = QURAN_DATA.find(r => r.para === para && r.rukuInPara === ruku) || null;
  }

  if (!row) return;

  if (isNaN(para) || para < 1 || para > 30 || !ruku) return;
  if (!row.audioUrl || !String(row.audioUrl).trim()) {
    noTrackEl.textContent = 'No audio path is set for this ruku in data.';
    noTrackEl.style.display = 'block';
    trackNameEl.style.display = 'none';
    return;
  }

  const audioAbs = new URL(row.audioUrl, window.location.href).href;
  queryLoadHint.style.display = 'block';
  queryLoadHint.textContent = 'Loading recording…';

  try {
    const res = await fetch(audioAbs);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const baseName = row.audioUrl.split('/').pop() || 'recording.opus';
    const file = new File([blob], baseName, { type: blob.type || 'audio/ogg' });
    const label = `Para ${para} · ${ruku} — ${row.surah} (${row.verses})`;

    files = [];
    currentIndex = -1;
    files.push({ file, name: label });

    const dzSpan = dropzone && dropzone.querySelector('span');
    if (dzSpan) dzSpan.textContent = 'Loaded from link — drop more files to replace playlist';
    document.title = `MQ · ${row.surah} (${ruku})`;

    loadTrack(0, { autoplay: true });
    queryLoadHint.style.display = 'none';
  } catch (err) {
    console.error(err);
    queryLoadHint.textContent = '';
    queryLoadHint.style.display = 'none';
    noTrackEl.textContent = 'Could not load audio (offline or missing file). Open the main app and save offline, or try again online.';
    noTrackEl.style.display = 'block';
    trackNameEl.style.display = 'none';
  }
}

initFromParaRukuQuery();

</script>
